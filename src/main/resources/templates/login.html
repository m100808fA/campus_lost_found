<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign In</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 50px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { padding: 8px; width: 250px; }
    .btn { padding: 8px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    .msg { margin-bottom: 15px; font-weight: bold; padding: 10px; border-radius: 4px; width: 250px; }
    .success-msg { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
    .error-msg { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }
    .info-msg { color: #0c5460; background-color: #d1ecf1; border: 1px solid #bee5eb; }
    .register-link { margin-top: 15px; display: block; }
  </style>
</head>
<body>

<h2>Sign In</h2>

<!-- 1. Parameter: ?registered -> Show Account created. Please sign in. -->
<div th:if="${param.registered}" class="msg success-msg">
  Account created. Please sign in.
</div>

<!-- 2. Parameter: ?error -> Show Wrong username or password. -->
<div th:if="${param.error}" class="msg error-msg">
  Wrong username or password.
</div>

<!-- 3. Parameter: ?logout -> Show You have signed out. -->
<div th:if="${param.logout}" class="msg info-msg">
  You have signed out.
</div>

<!-- Spring Security's default processing endpoint is /login via POST -->
<form th:action="@{/login}" method="post">
  <div class="form-group">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required />
  </div>

  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required />
  </div>

  <button type="submit" class="btn">Sign in</button>
</form>

<a class="register-link" th:href="@{/register}">Don't have an account? Register</a>

</body>
</html>
