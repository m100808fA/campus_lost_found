<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register Account</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 50px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { padding: 8px; width: 250px; }
    .btn { padding: 8px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    .error-msg { color: red; margin-bottom: 15px; font-weight: bold; }
    .signin-link { margin-top: 15px; display: block; }
  </style>
</head>
<body>

<h2>Create an Account</h2>

<!-- Dynamic Error Display -->
<div th:if="${error}" class="error-msg" th:text="${error}"></div>

<form th:action="@{/register}" method="post">
  <div class="form-group">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" th:value="${username}" required />
  </div>

  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required />
  </div>

  <button type="submit" class="btn">Register</button>
</form>

<a class="signin-link" th:href="@{/login}">Already have an account? Sign In</a>

</body>
</html>
